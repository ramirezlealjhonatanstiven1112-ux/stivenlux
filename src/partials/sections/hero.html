<section class="hero" id="inicio" data-theme="light" aria-labelledby="hero-title">
  <div class="hero__copy">
    <h1 class="hero__title" id="hero-title">
      <span class="line"><span>No hacemos</span></span>
      <span class="line"><span>lo de siempre.</span></span>
    </h1>
    <p class="hero__lead">
      Diseñamos y desarrollamos experiencias web a medida para marcas que quieren destacar, no encajar.
    </p>
    <div class="hero__actions">
      <a class="btn" href="#contacto" data-whatsapp data-magnet>Iniciar proyecto por WhatsApp</a>
      <a class="link" href="#proyectos">Ver proyectos</a>
    </div>
  </div>

  <!--
    Escena del hero: ensamblaje progresivo de mockups en HTML/CSS/JS (alternativa web en vivo).
    La versión en video está en video/hero/ (HyperFrames). Ver PROJECT_BRIEF.md.
  -->
  <div class="hero__stage" data-hero-stage aria-hidden="true">
    <div class="hero__layer hero__layer--back" data-depth="0.35">
      <include src="devices/browser.html" class="hero__device hero__device--back" url="esmalteclaro.concept" screen="dental" photo-sizes="(min-width: 64.01em) 30vw, (min-width: 48em) 34vw, 70vw" card-sizes="(min-width: 64.01em) 6vw, (min-width: 48em) 7vw, 14vw" skip="not all" loading="eager"></include>
    </div>
    <div class="hero__layer hero__layer--mid" data-depth="0.7">
      <include src="devices/browser.html" class="hero__device hero__device--mid" url="pulso.concept" screen="store" photo-sizes="(min-width: 64.01em) 28vw, 31vw" card-sizes="6vw" skip="(max-width: 47.99em)" loading="eager"></include>
    </div>
    <div class="hero__layer hero__layer--front" data-depth="1.1">
      <include src="devices/phone.html" class="hero__device hero__device--front" screen="climate" top-sizes="(min-width: 64.01em) 11vw, (min-width: 48em) 13vw, 36vw" skip="not all" loading="eager"></include>
    </div>
  </div>
</section>
