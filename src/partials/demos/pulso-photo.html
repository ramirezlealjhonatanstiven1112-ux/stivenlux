<picture class="photo photo--{{photo}}">
  <source type="image/avif" srcset="/media/conceptos/tienda-{{photo}}-{{w1}}.avif {{w1}}w, /media/conceptos/tienda-{{photo}}-{{w2}}.avif {{w2}}w" sizes="{{sizes}}" />
  <source type="image/webp" srcset="/media/conceptos/tienda-{{photo}}-{{w1}}.webp {{w1}}w, /media/conceptos/tienda-{{photo}}-{{w2}}.webp {{w2}}w" sizes="{{sizes}}" />
  <img src="/media/conceptos/tienda-{{photo}}-{{w1}}.jpg" alt="{{alt}}" width="{{w}}" height="{{h}}" loading="{{loading}}" decoding="async" />
</picture>
