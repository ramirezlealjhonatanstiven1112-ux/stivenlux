<div class="scr scr--dental">
  <div class="c-desk">
    <div class="c-nav" data-a style="--a: 1">
      <span class="c-logo">Esmalte Claro</span>
      <span class="c-links">Tratamientos<span>Agendar cita</span></span>
    </div>
    <div class="c-hero">
      <picture class="c-photo c-photo--hero" data-a style="--a: 2">
        <source type="image/avif" srcset="/media/conceptos/odonto-hero-640.avif 640w, /media/conceptos/odonto-hero-1000.avif 1000w, /media/conceptos/odonto-hero-1376.avif 1376w" sizes="{{photo-sizes}}" />
        <source type="image/webp" srcset="/media/conceptos/odonto-hero-640.webp 640w, /media/conceptos/odonto-hero-1000.webp 1000w, /media/conceptos/odonto-hero-1376.webp 1376w" sizes="{{photo-sizes}}" />
        <img src="/media/conceptos/odonto-hero-1000.jpg" alt="" width="1376" height="768" loading="{{desk-loading}}" decoding="async" />
      </picture>
      <div class="c-copy" data-a style="--a: 3">
        <span class="c-title">Todo claro,<br />desde la cita.</span>
        <span class="c-lead">Elige tratamiento, día y hora. Sin llamadas y sin letra pequeña.</span>
        <span class="c-btn">Agendar cita</span>
      </div>
    </div>
    <div class="c-row" data-a style="--a: 4">
      <span class="c-list">
        <span class="c-service">Valoración<span>40 min</span></span>
        <span class="c-service">Limpieza<span>45 min</span></span>
        <span class="c-service">Restauración<span>50 min</span></span>
      </span>
      <span class="c-card c-card--wide">
        <picture class="c-photo">
        <source type="image/avif" srcset="/media/conceptos/odonto-bodegon-480.avif 480w, /media/conceptos/odonto-bodegon-960.avif 960w" sizes="(min-width: 48em) 22vw, 37vw" />
        <source type="image/webp" srcset="/media/conceptos/odonto-bodegon-480.webp 480w, /media/conceptos/odonto-bodegon-960.webp 960w" sizes="(min-width: 48em) 22vw, 37vw" />
        <img src="/media/conceptos/odonto-bodegon-480.jpg" alt="" width="1024" height="1024" loading="{{desk-loading}}" decoding="async" />
      </picture>
      </span>
    </div>
  </div>
  <div class="c-phone">
    <div class="c-nav" data-a style="--a: 1"><span class="c-logo">Esmalte Claro</span></div>
    <picture class="c-photo c-photo--top" data-a style="--a: 2">
        <source type="image/avif" srcset="/media/conceptos/odonto-hero-640.avif 640w, /media/conceptos/odonto-hero-1000.avif 1000w, /media/conceptos/odonto-hero-1376.avif 1376w" sizes="(min-width: 48em) 29vw, 65vw" />
        <source type="image/webp" srcset="/media/conceptos/odonto-hero-640.webp 640w, /media/conceptos/odonto-hero-1000.webp 1000w, /media/conceptos/odonto-hero-1376.webp 1376w" sizes="(min-width: 48em) 29vw, 65vw" />
        <img src="/media/conceptos/odonto-hero-1000.jpg" alt="" width="1376" height="768" loading="{{phone-loading}}" decoding="async" />
      </picture>
    <div class="c-form">
      <span class="c-title" data-a style="--a: 3">¿A qué hora?</span>
      <span class="c-field" data-a style="--a: 3">Tratamiento<em>Limpieza</em></span>
      <span class="c-slots" data-a style="--a: 3"><i>08:00</i><i class="is-on">09:00</i><i>10:00</i><i>11:00</i><i>14:00</i><i>16:00</i></span>
      <span class="c-btn" data-a style="--a: 4">Continuar</span>
    </div>
  </div>
</div>
